name: Super Paste release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v<version> tag; leave empty to release the selected ref and create its version tag'
        type: string
        required: false
      publish_aur:
        description: 'Publish super-paste-bin after the GitHub release succeeds (requires AUR credentials)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      rust: ${{ steps.release.outputs.rust }}
      packager: ${{ steps.release.outputs.packager }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - id: release
        name: Verify workspace version, tag and commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.mjs

  build:
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.prepare.outputs.rust }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config clang cmake libssl-dev \
            libfontconfig1-dev libfreetype6-dev libgtk-3-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libxcb-randr0-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-cursor-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev \
            libvulkan-dev patchelf libarchive-tools binutils unzip xz-utils zstd
      - name: Configure MSVC and Windows SDK tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Select the MSVC linker for Cargo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (!(Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker not found at $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Prepare Metal compiler
        if: runner.os == 'macOS'
        run: |
          if ! xcrun --sdk macosx metal -v; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v5
        id: packager-cache
        with:
          path: ~/.cargo/bin/cargo-packager*
          key: packager-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.packager }}-${{ needs.prepare.outputs.rust }}
      - name: Install pinned cargo-packager
        if: steps.packager-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          PACKAGER_VERSION: ${{ needs.prepare.outputs.packager }}
        run: cargo install cargo-packager --version "$PACKAGER_VERSION" --locked
      - uses: actions/cache@v5
        with:
          path: resources/ort/${{ matrix.target }}
          key: ort-${{ matrix.target }}-${{ hashFiles('resources/ort-runtime.json', 'scripts/prepare-ort.mjs', 'scripts/ort-manifest.mjs') }}
      - name: Build native installers and portable bundles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build.mjs
      - name: Collect versioned release assets
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/collect-release-assets.mjs "$BUILD_TARGET" release-assets
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: symbols-${{ matrix.target }}
          path: dist/${{ matrix.target }}/${{ needs.prepare.outputs.version }}/symbols/super-paste.debug
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          compression-level: 0
          path: release-assets/*
          if-no-files-found: error

  arch-package:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: build-x86_64-unknown-linux-gnu
          path: release-assets
      - name: Generate Arch package and AUR metadata from the built DEB
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm \
            --env RELEASE_VERSION --env GITHUB_REPOSITORY \
            --env BUILDER_UID="$(id -u)" --env BUILDER_GID="$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" archlinux:base-devel bash -euxc '
              pacman -Syu --noconfirm --needed nodejs libarchive zstd
              if ! getent group "$BUILDER_GID" >/dev/null; then groupadd --gid "$BUILDER_GID" builder; fi
              useradd --create-home --uid "$BUILDER_UID" --gid "$BUILDER_GID" builder
              runuser -u builder -- node /workspace/scripts/prepare-aur.mjs \
                --repository "$GITHUB_REPOSITORY" \
                --deb "/workspace/release-assets/super-paste_${RELEASE_VERSION}_x86_64-unknown-linux-gnu.deb" \
                --output /workspace/release-assets
            '
      - uses: actions/upload-artifact@v7
        with:
          name: build-arch-x86_64
          compression-level: 0
          path: |
            release-assets/*.pkg.tar.zst
            release-assets/super-paste-bin.PKGBUILD
            release-assets/super-paste-bin.SRCINFO
          if-no-files-found: error

  publish:
    needs: [prepare, build, arch-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: release-assets
      - name: Publish draft, assets, checksums and changelog
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs release-assets

  aur:
    needs: [prepare, publish]
    if: inputs.publish_aur == true || vars.AUR_AUTO_PUBLISH == 'true'
    uses: ./.github/workflows/aur.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.commit }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
