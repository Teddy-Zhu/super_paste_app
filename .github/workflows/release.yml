name: Super Paste release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v<version> tag; leave empty to release the selected ref and create its version tag'
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - id: release
        name: Verify release version, tag and commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync-version.mjs
          node scripts/prepare-release.mjs

  build:
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.3'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libfuse2t64 \
            libgtk-3-dev libgtk-layer-shell-dev libssl-dev librsvg2-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libxdo-dev libxkbcommon-dev \
            patchelf pkg-config rpm wget
      - name: Install pnpm and project dependencies
        shell: bash
        working-directory: .
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore pinned ONNX Runtime
        id: ort-cache
        uses: actions/cache/restore@v5
        with:
          path: resources/ort/${{ matrix.target }}
          key: ort-${{ matrix.target }}-${{ hashFiles('scripts/prepare-ort.mjs') }}
      - name: Prepare and verify ONNX Runtime
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-ort.mjs --target '${{ matrix.target }}'
      - name: Cache verified ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: resources/ort/${{ matrix.target }}
          key: ${{ steps.ort-cache.outputs.cache-primary-key }}
      - name: Restore pinned AppImage tools
        if: runner.os == 'Linux'
        id: appimage-tools-cache
        uses: actions/cache/restore@v5
        with:
          path: target/tauri-bundler-tools
          key: appimage-${{ runner.arch }}-${{ hashFiles('.github/workflows/release.yml', 'pnpm-lock.yaml') }}
      - name: Prepare and verify AppImage tools
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download_dir="$GITHUB_WORKSPACE/target/tauri-bundler-tools"
          tools_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$download_dir" "$tools_dir"

          prepare_tool() {
            local repository="$1" asset_id="$2" name="$3" sha256="$4"
            local archive="$download_dir/$name"
            if [[ ! -f "$archive" ]] || ! printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check --status; then
              gh api "repos/$repository/releases/assets/$asset_id" \
                --header 'Accept: application/octet-stream' > "$archive.part"
              printf '%s  %s\n' "$sha256" "$archive.part" | sha256sum --check
              mv "$archive.part" "$archive"
            fi
            # Tauri patches linuxdeploy in place; cache the pristine download separately.
            install -m 755 "$archive" "$tools_dir/$name"
          }

          prepare_tool tauri-apps/binary-releases 274691722 AppRun-x86_64 \
            f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
          prepare_tool tauri-apps/binary-releases 576945544 linuxdeploy-07333c6-x86_64.AppImage \
            36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62
          prepare_tool linuxdeploy/linuxdeploy-plugin-appimage 602435573 linuxdeploy-plugin-appimage.AppImage \
            49d6a17160675a6bd1781699aae6bdf7692d98552e02a3671d2183d10547842e
          prepare_tool AppImage/type2-runtime 657374641 runtime-x86_64 \
            617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46
      - name: Cache verified AppImage tools
        if: runner.os == 'Linux' && steps.appimage-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target/tauri-bundler-tools
          key: ${{ steps.appimage-tools-cache.outputs.cache-primary-key }}
      - name: Build Tauri installers
        working-directory: .
        env:
          LDAI_RUNTIME_FILE: ${{ github.workspace }}/target/tauri-bundler-tools/runtime-x86_64
        run: pnpm build
      - name: Build the standalone migration utility
        working-directory: .
        run: cargo build --release -p migrate-electron
      - name: Package portable archive
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: .
        shell: bash
        run: node scripts/package-portable.mjs '${{ matrix.target }}'
      - name: Collect versioned release assets
        working-directory: .
        shell: bash
        run: node scripts/collect-release-assets.mjs '${{ matrix.target }}' release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          compression-level: 0
          path: release-assets/**
          if-no-files-found: error

  arch-package:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: build-x86_64-unknown-linux-gnu
          path: release-assets
      - name: Generate Arch package and AUR source metadata
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm \
            --env RELEASE_VERSION \
            --env GITHUB_REPOSITORY \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            archlinux:base-devel \
            bash -euxc '
              pacman -Syu --noconfirm nodejs libarchive zstd
              useradd --create-home builder
              chown -R builder:builder /workspace
              su - builder -c "node /workspace/scripts/sync-version.mjs && node /workspace/scripts/prepare-aur.mjs --repository $GITHUB_REPOSITORY --deb /workspace/release-assets/super-paste_${RELEASE_VERSION}_x86_64-unknown-linux-gnu.deb --output /workspace/release-assets"
            '
          cp release-assets/aur/super-paste-bin/PKGBUILD release-assets/super-paste-bin.PKGBUILD
          cp release-assets/aur/super-paste-bin/.SRCINFO release-assets/super-paste-bin.SRCINFO
      - uses: actions/upload-artifact@v7
        with:
          name: build-arch-x86_64
          compression-level: 0
          path: |
            release-assets/*.pkg.tar.zst
            release-assets/super-paste-bin.PKGBUILD
            release-assets/super-paste-bin.SRCINFO
          if-no-files-found: error

  publish:
    needs: [prepare, build, arch-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: release-assets
      - name: Publish the v release and checksums
        working-directory: .
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync-version.mjs
          node scripts/publish-release.mjs release-assets
