name: Super Paste release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v<version> tag; leave empty to release the selected ref and create its version tag'
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - id: release
        name: Verify release version, tag and commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.mjs

  build:
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.3'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libfuse2t64 \
            libgtk-3-dev libgtk-layer-shell-dev libssl-dev librsvg2-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libxdo-dev libxkbcommon-dev \
            patchelf pkg-config rpm wget
      - name: Install pnpm and project dependencies
        shell: bash
        working-directory: .
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Tauri installers
        working-directory: .
        run: pnpm build
      - name: Build the standalone migration utility
        working-directory: .
        run: cargo build --release -p migrate-electron
      - name: Package portable archive
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: .
        shell: bash
        run: node scripts/package-portable.mjs '${{ matrix.target }}'
      - name: Collect versioned release assets
        working-directory: .
        shell: bash
        run: node scripts/collect-release-assets.mjs '${{ matrix.target }}' release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          compression-level: 0
          path: release-assets/**
          if-no-files-found: error

  arch-package:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: build-x86_64-unknown-linux-gnu
          path: release-assets
      - name: Generate Arch package and AUR source metadata
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm \
            --env RELEASE_VERSION \
            --env GITHUB_REPOSITORY \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            archlinux:base-devel \
            bash -euxc '
              pacman -Syu --noconfirm nodejs libarchive zstd
              useradd --create-home builder
              chown -R builder:builder /workspace
              su - builder -c "node /workspace/scripts/prepare-aur.mjs --repository $GITHUB_REPOSITORY --deb /workspace/release-assets/super-paste_${RELEASE_VERSION}_x86_64-unknown-linux-gnu.deb --output /workspace/release-assets"
            '
          cp release-assets/aur/super-paste-bin/PKGBUILD release-assets/super-paste-bin.PKGBUILD
          cp release-assets/aur/super-paste-bin/.SRCINFO release-assets/super-paste-bin.SRCINFO
      - uses: actions/upload-artifact@v7
        with:
          name: build-arch-x86_64
          compression-level: 0
          path: |
            release-assets/*.pkg.tar.zst
            release-assets/super-paste-bin.PKGBUILD
            release-assets/super-paste-bin.SRCINFO
          if-no-files-found: error

  publish:
    needs: [prepare, build, arch-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: release-assets
      - name: Publish the v release and checksums
        working-directory: .
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs release-assets
