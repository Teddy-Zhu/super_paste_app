[package]
name = "super-paste-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
super-paste-format.workspace = true
super-paste-core.workspace = true
clipboard-core = { path = "../../vendor/clipboard-core" }
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
tracing.workspace = true
keyring-core.workspace = true
zeroize.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
image.workspace = true
base64.workspace = true
x-win = "=5.8.0"
anyhow = "1"
crossbeam-channel.workspace = true
bytes.workspace = true
imagesize.workspace = true
sha2.workspace = true
fs2 = "=0.4.3"
interprocess = { version = "=2.4.7", features = ["tokio"] }
global-hotkey = "=0.8.0"
futures-util.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "=0.3.6"
gtk = "=0.18.2"
# Share GPUI's portal backend: ashpd forbids enabling both runtimes together.
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
dbus = { version = "0.9", features = ["vendored"] }
tempfile = "3"
xcb = { version = "1.7", features = ["randr"] }
mio = { version = "1", features = ["os-poll", "os-ext"] }
freedesktop-desktop-entry = { version = "=0.8.4", default-features = false }
freedesktop-icons = "=0.4.0"
resvg = { version = "=0.46.0", default-features = false, features = ["text", "raster-images", "system-fonts"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "=0.26.0", default-features = false }
file_icon_provider = "=1.0.2"

[target.'cfg(target_os = "windows")'.dependencies]
auto-launch = "=0.6.0"
windows-native-keyring-store = "1.1.0"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "block2"] }
block2 = "0.6"

[lints.rust]
# Only the native event modules explicitly opt into FFI; application/core crates remain forbid.
unsafe_code = "deny"
