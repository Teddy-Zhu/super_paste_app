appId: com.v2dawn.sp
productName: SuperPaste
directories:
  buildResources: build
icon: build/icon/icons/icon
files:
  # 生产依赖由 electron-builder 单独收集，项目文件只包含运行产物和图标。
  - out/**
  - resources/icon.png
  - '!**/*.map'
  - '!**/*.d.{ts,mts,cts}'
  # 其他依赖的 src 可能就是运行入口，按包裁剪源码。
  - '!**/node_modules/{onnxruntime-node,onnxruntime-common}/**/*.{ts,tsx,mts,cts}'
  - '!**/node_modules/{ajv,ajv-formats,@stablelib/base64,data-uri-to-buffer,boolean,fast-uri}/**/*.{ts,tsx,mts,cts}'
  - '!**/node_modules/node-addon-api{,/**}'
  - '!**/node_modules/better-sqlite3/{deps,src,bin}{,/**}'
  - '!**/node_modules/better-sqlite3/build/Release/{obj,obj.target,.deps}{,/**}'
  - '!**/node_modules/better-sqlite3/build/Release/test_extension.node'
  - '!**/node_modules/canvas/{src,util}{,/**}'
  - '!**/node_modules/@paymoapp/active-window/{module,scripts}{,/**}'
  - '!**/node_modules/onnxruntime-node/script{,/**}'
  - '!**/*onnxruntime_providers_cuda*'
  - '!**/*onnxruntime_providers_tensorrt*'
  - '!**/node_modules/@super-paste/active-window-kwin/{target,src,scripts}/**'
  - '!**/node_modules/@super-paste/active-window-kwin/{Cargo.*,build.rs}'
asarUnpack:
  - '**/node_modules/{better-sqlite3,canvas,@paymoapp/active-window}/build/Release/**'
  - '**/node_modules/onnxruntime-node/bin/**'
  - '**/@teddyzhu/clipboard-*/**/*.node'
  - '**/@super-paste/active-window-kwin/**/*.node'
  - resources/icon.png
electronLanguages:
  - en-US
  - zh-CN
extraFiles:
  - from: LICENSE
    to: LICENSE.super-paste
afterPack: scripts/afterPack.js
toolsets:
  appimage: '1.0.3'
win:
  executableName: super_paste_app
  icon: build/icon/icons/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon/icons/icon.icns
  extendInfo:
    - NSAppleEventsUsageDescription: Please allow access to script browser applications to detect the current URL when triggering instant lookup.
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - target: deb
      arch:
        - x64
    - target: pacman
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  executableName: com.v2dawn.sp
  maintainer: Teddy Zhu <teddyzhu15@gmail.com>
  category: Utility
  icon: build/icon/icons
  desktop:
    entry:
      name: SuperPaste
      comment: a clipboard manager tool
      StartupWMClass: SuperPaste
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
  compression: zstd
publish:
  provider: generic
  url: https://example.com/auto-updates
