appId: com.v2dawn.sp
productName: SuperPaste
directories:
  buildResources: build
icon: build/icon/icons/icon
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*onnxruntime_providers_cuda*'
  - '!**/*onnxruntime_providers_tensorrt*'
  - '!scripts/*'
asarUnpack:
  - '**/@teddyzhu/clipboard/**/*.node'
  - resources/**
extraResources:
  - from: resources/ocr/
    to: resources/ocr/
    filter:
      - '**/*'
electronLanguages:
  - en-US
  - zh-CN
afterPack: scripts/afterPack.js
win:
  executableName: super_paste_app
  icon: build/icon/icons/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon/icons/icon.icns
  extendInfo:
    - NSAppleEventsUsageDescription: Please allow access to script browser applications to detect the current URL when triggering instant lookup.
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - target: deb
      arch:
        - x64
    - target: pacman
      arch:
        - x64
  executableName: com.v2dawn.sp
  maintainer: electronjs.org
  category: Utility
  icon: build/icon/icons
  desktop:
    entry:
      name: SuperPaste
      comment: a clipboard manager tool
      StartupWMClass: SuperPaste
appImage:
  artifactName: ${name}-${version}.${ext}
publish:
  provider: generic
  url: https://example.com/auto-updates
