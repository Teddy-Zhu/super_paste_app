[package]
name = "clipboard-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
image = { version = "0.25", default-features = false }
url = "2.5"
tracing = "0.1"
futures-channel = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "=0.9.5"
rustix = { version = "1", features = ["event", "net"] }
wayland-client = "0.31.11"
